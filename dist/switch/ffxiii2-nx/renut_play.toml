# ffxiii2-nx: for playing. renut.toml with the logs off (no log writes on the game's cores).
# Copy it next to the NRO as ffxiii2.toml (sdmc:/switch/ffxiii2-nx/ffxiii2.toml).
# Credits: reNut's renderer (masterspike52, reuse permitted), banjo-nx, katamari-nx, renut-nx, sa2-nx, NetherSX2_nx,
# battd_nx, bejeweled3-nx and the zuma ports.

# Language: 1 = English, 2 = Japanese, 3 = German, 4 = French, 5 = Spanish, 6 = Italian.
user_language = 1
# Face buttons: false = by letter (the Switch's A acts as A), true = by position, as on an Xbox pad (bottom = A).
input_xbox_layout = false
input_joycon_sideways = true
input_joycon_sideways_stick = true

log_level = "off"
log_file_writer = false
