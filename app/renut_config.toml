args_in_registers_exclude_file = "args_exclude.txt"
args_in_registers_instrument = true
args_in_registers_poison = true

# default.xex (EU 0.0.0.11 + TU6 0.0.6.11): functions the automatic discovery misses. Every entry carries its evidence.
#
# Pass 1 (codegen 2026-11-02, "target not in any function"): code reached only by a tail branch (b) from another
# function and lying in a .pdata gap. Extent: tools/extent.py on out/default_image.bin, from the entry through every
# forward conditional branch to the unconditional exit (b/blr/bctr) that ends it; each one ends right before zero
# padding or the next function's prologue (mflr r12), checked by disassembly. Each entry reads only argument
# registers (r3-r10, f1) before writing, so it is a function entry, not a fragment.
# 13 of the 20 entry addresses coincide with the USA TU 0.0.1.13 hints of leftisthominid/ffxiii-2-port; sizes were
# re-derived here (five of the USA sizes stop at the first blr and would cut the function short).
# setjmp / longjmp (found by shape, tools/local/sjlj.py + disassembly, 2026-11-02):
#   setjmp  0x82C15C20: hook check (lwz r0 from 0x82EBF700; bnectr), mflr r0, mfcr r4, stfd f14-f31 0..136(r3),
#           std r13-r31 152..296(r3), stvx128 v0.. from 320(r3)
#   longjmp 0x82C15900: mr r7,r3; lfd f14-f31 0..136(r7), ld r13-r31, lvx128 from 320(r7), mtlr r5, ld r1,144(r7),
#           mtcr r4, blr: the mirror of setjmp's offsets.
# No static caller in default.xex or the zone DLLs (no bl/b, no stored pointer except longjmp's own .pdata entry, no
# lis/addi build): declared so the generator handles them correctly if they are reached.
setjmp_address = 0x82C15C20
longjmp_address = 0x82C15900

project_name = "renut"
file_path = "assets/default.xex"
out_directory_path = "generated"

