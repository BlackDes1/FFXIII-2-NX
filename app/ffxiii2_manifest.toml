# ReXGlue recompilation manifest: Final Fantasy XIII-2, Europe disc (default.xex 0.0.0.11) + TU6 (0.0.6.11),
# title 53510806. game_root holds the disc's default.xex / z*.xex with the TU's *.xexp beside them; the SDK applies
# each .xexp to its .xex on load (UserModule::LoadFromFile, sibling "<path>p"), at codegen and at run time.
# default.xex: base 0x82000000, entry 0x82B31D08, image 0xF10000 (patched: 0xF50000). See docs/stage1-inspection.md.

[project]
name = "ffxiii2"
sdk_version = "0.10.0"
game_root = "../../game_root"

[entrypoint]
file_path = "../../game_root/default.xex"
out_directory_path = "generated/default"
includes = ["analysis/default_functions.toml"]

# Zone DLLs, loaded at run time (XexLoadImage); all four share base 0x88800000 (one resident at a time).
[[modules]]
guest_path = "z0070.xex"
file_path = "../../game_root/z0070.xex"
out_directory_path = "generated/z0070"
includes = ["analysis/z0070_functions.toml"]

[[modules]]
guest_path = "z0130.xex"
file_path = "../../game_root/z0130.xex"
out_directory_path = "generated/z0130"
includes = ["analysis/z0130_functions.toml"]

[[modules]]
guest_path = "z0160.xex"
file_path = "../../game_root/z0160.xex"
out_directory_path = "generated/z0160"
includes = ["analysis/z0160_functions.toml"]

[[modules]]
guest_path = "z0161.xex"
file_path = "../../game_root/z0161.xex"
out_directory_path = "generated/z0161"
includes = ["analysis/z0161_functions.toml"]
