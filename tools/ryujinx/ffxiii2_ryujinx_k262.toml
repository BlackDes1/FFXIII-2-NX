# ffxiii2-nx (2026-11-08, k262, the user: tests in Ryujinx in handheld mode): ffxiii2_ryujinx.toml (the scripted way to the
# first battle) + the k257 baseline keys + the copy guard (64 calls per thread, then 1 in 4096: [hot] DIFFERENCE
# switches a copy off) + the in-run A/B of all bulk copies (target 20, 5 s halves) + the profiler overlay.
update_data_root = "/switch/ffxiii2-nx/update"
log_level = "info"
log_file_writer = true
input_xbox_layout = true
# The PC's sequence (title -> main menu -> New Game / Continue -> opening -> first battle), pressed by the SDK.
input_script = "20:A,24:START,28:A,32:A,36:A,40:UP,43:A,60:START,62:BACK,64:A,80:START,82:BACK,84:A,100:START,102:BACK,104:A,120:A,130:A,140:START,142:BACK,144:A,160:A,170:A,180:START,182:BACK,184:A,200:A,210:A,220:A,230:A,240:A,250:A,260:A,270:A"
# Captures every 15 s (the work order), next to the NRO in captures\.
nfsmw_captura_cada_s = 15
nfsmw_captura_max = 60

banjo_renut_dynamic_resolution = false
ffxiii2_renut_compose_resolves = true
banjo_show_profiler = true
banjo_hot_guard_calls = 64
banjo_hot_guard_period = 4096
banjo_renut_ab_target = 20
banjo_renut_ab_s = 5
