# ffxiii2-nx (2026-11-06): D-003 test (docs/diagnostics/BUGS.md): every deko3d barrier as a full barrier with the L2
# cache and images invalidated (ffxiii2_deko3d_full_barriers), plus the [tiles] / [strip] logs and the frame stamp as
# renut_tiles_log.toml. Banded frames hold rectangular blocks of other content, as when a texture is read while a copy
# into it is still running. Costs GPU time: a diagnostic session, never a benchmark.
# Credits: reNut's renderer (masterspike52, reuse permitted), banjo-nx, katamari-nx, renut-nx, sa2-nx, NetherSX2_nx,
# battd_nx, bejeweled3-nx and the zuma ports.

user_language = 1
input_xbox_layout = false
input_joycon_sideways = true
input_joycon_sideways_stick = true

log_level = "info"
log_file_writer = true
log_file_reopen = true
banjo_profiler_pad_toggle = true
banjo_profiler_pad_combo = "L3+R3"
input_shared_players = true

ffxiii2_diag_tiles_log = true
ffxiii2_swapchain_compression = false
ffxiii2_diag_frame_stamp = true
ffxiii2_deko3d_full_barriers = true
