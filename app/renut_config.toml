# ffxiii2-nx (Final Fantasy XIII-2, Europe disc 0.0.0.11 + TU6 0.0.6.11, title 53510806) - ReXGlue codegen
# configuration of default.xex, on the katamari-nx base (2026-11-03). The project keeps banjo-nx's / katamari-nx's
# internal name "renut" (generated/renut_*.h, the renut / renut_recomp targets, out/renut_image.bin) so their CMake,
# post-codegen passes and renderer glue work unchanged; the NRO and the SD folder are ffxiii2-nx
# (docs/ffxiii2-nx.md, "Decisions"). The zone modules' entries are config/ffxiii2/z*_functions.toml.

includes = [
"config/renut_funcs.toml",
"config/renut_hooks.toml",
"overrides.toml",
]

# banjo-nx's optimised codegen keys that need no per-game audit (they change how the C++ is written, not what the
# guest sees; banjo-nx's renut_config.toml carries the reasoning and the console measurements for each):
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
fp_moves_modeless = true

# The register "diet" (katamari-nx / banjo-nx), ffxiii2-nx k264 (2026-11-08): non_volatile_as_local and
# elide_lr_stores ON. Audit: tools/read_before_write.py --noreturn=82C15900 on a codegen WITH them (out/audit/gen_diet,
# tools/ffxiii2_diet_audit_job.ps1), noreturn seeds 82C15900 (longjmp) and 82C150C8 (_CxxThrowException: without it
# 82505B90 / 82A53108 looked like split pieces; marked share_registers in a first try, they crashed the boot (k264)).
# The vector registers read before any write stay in ctx (below); left: 82B6A100 / 82B6A490 (xor r30,r30,r30: the
# value is 0 whatever r30 held), 82BC4D90 (a carry of ~r29 + r29: independent of r29) and setjmp 82C15C20 (the
# codegen's setjmp handling) - all four exact. non_argument_as_local stays OFF (its audit needs a raw codegen without it).
non_volatile_as_local = true
# FFXIII-2-Native-Switch: elide_lr_stores OFF (2026-11-08 14:08): the old project found k264b (both diet keys) dying at
# the first zone load (Ryujinx) and at boot (PC); its k264c bisect keeps the link-register stores. Re-enable only after
# that is resolved.
elide_lr_stores = false
non_volatile_as_local_keep = ["v29", "v117", "v119", "v120", "v121", "v122", "v124", "v125", "v126", "v127"]
# FFXIII-2-Native-Switch P1 (2026-11-08): ABI-lifted codegen. Validation flavour (PC): instrument + poison ON;
# the performance flavour sets both false. Exclude file = the 2,400 functions overridden in the k264b ELF (hooks,
# machine copies, natives) in P1b (copies kept); P1a (copies retired) uses the 286 real hooks only. See the P1 README. non_argument_as_local needs the p1_raw audit keep list first.
non_argument_as_local = true
# keep list round 1 from the P1 audits (prototypes/P1_abi_lifted_codegen/audit/keep_round1.toml: 108 functions with evidence)
non_argument_as_local_keep = [0x8225D008, 0x822996A0, 0x8231EDE8, 0x8231F098, 0x8231F728, 0x8239DA28, 0x823A7730, 0x82450408, 0x824BC140, 0x824C7B40, 0x82590548, 0x825E89C0, 0x825E9760, 0x825F07C0, 0x8286E304, 0x8286E53C, 0x828846D8, 0x82891560, 0x828F0BF0, 0x828F5088, 0x828F5AE0, 0x82913EC8, 0x829142D8, 0x8296AEF0, 0x8296AF48, 0x829B47F0, 0x829D1DD0, 0x829D1F00, 0x829D2C90, 0x829D2E10, 0x829DAC70, 0x829DEC10, 0x829DF4C8, 0x829DF518, 0x829DF528, 0x829E3468, 0x829E4A58, 0x829EEC70, 0x829F0DC8, 0x829F5E98, 0x829FCF30, 0x829FF400, 0x829FF4E0, 0x82A002B0, 0x82A944B0, 0x82B06368, 0x82B06610, 0x82B07070, 0x82B09528, 0x82B118B8, 0x82B12A48, 0x82B138E0, 0x82B4F1C8, 0x82B4F1E8, 0x82B4FC94, 0x82B4FCB4, 0x82B4FED4, 0x82B4FEF4, 0x82B5003C, 0x82B5005C, 0x82B507B4, 0x82B541DC, 0x82B541FC, 0x82B544FC, 0x82B5451C, 0x82B546BC, 0x82B546DC, 0x82B54A1C, 0x82B54A3C, 0x82B54F78, 0x82B54FA4, 0x82B56A54, 0x82B56A74, 0x82B58198, 0x82B581B8, 0x82B5B8A0, 0x82B5B8C0, 0x82B5D580, 0x82B5D5A0, 0x82B5D7BC, 0x82B5D7DC, 0x82B5DB84, 0x82B5DBA4, 0x82B5DD00, 0x82B5DD20, 0x82B5DFE8, 0x82B5E008, 0x82B5F270, 0x82B5F338, 0x82B5FC24, 0x82B5FC44, 0x82B68570, 0x82B68598, 0x82B68864, 0x82B6888C, 0x82B69128, 0x82B69148, 0x82B6BF50, 0x82BAAE10, 0x82BAB2F8, 0x82BACAC0, 0x82BACF10, 0x82BAD280, 0x82BAD688, 0x82C15498, 0x82C17230, 0x82C17FB0, 0x82C17FDC]
