# ffxiii2-nx (2026-11-06): D-003 / shadow cascade test (docs/diagnostics/BUGS.md). ffxiii2_renut_stable_rewritten_surfaces
# on: FF rewrites its scene surface headers as shadow cascade headers between bindings; each binding now keeps the
# header's contents at bind time (as the console's D3D). CHANGES THE PICTURE (the shadows): a test config, the user's
# decision. One [rtlog] line per frame from 120 s (the cascades' depth surfaces), uncompressed swapchain for Frame Tap.
# Credits: reNut's renderer (masterspike52, reuse permitted), banjo-nx, katamari-nx, renut-nx, sa2-nx, NetherSX2_nx,
# battd_nx, bejeweled3-nx and the zuma ports.

user_language = 1
input_xbox_layout = false
input_joycon_sideways = true
input_joycon_sideways_stick = true

log_level = "info"
log_file_writer = true
log_file_reopen = true
banjo_profiler_pad_toggle = true
banjo_profiler_pad_combo = "L3+R3"
input_shared_players = true

ffxiii2_swapchain_compression = false
ffxiii2_renut_stable_rewritten_surfaces = true
ffxiii2_diag_rt_start_s = 120
ffxiii2_diag_rt_frames = 3000
